plugins {
    id 'com.android.application'
}

def localSecrets = new Properties()
def localSecretsFile = rootProject.file('local.properties')
if (localSecretsFile.isFile()) localSecretsFile.withInputStream { localSecrets.load(it) }
def unsplashAccessKey = localSecrets.getProperty('UNSPLASH_ACCESS_KEY', '')
def currentsApiKey = localSecrets.getProperty('CURRENTS_API_KEY', '')

android {
    namespace 'com.vdx.kinodock'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.vdx.kinodock')
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '3.0'
        // Default to empty. Only a local debug APK may use a contributor's own keys.
        buildConfigField 'String', 'UNSPLASH_ACCESS_KEY', '""'
        buildConfigField 'String', 'CURRENTS_API_KEY', '""'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'UNSPLASH_ACCESS_KEY', '"' + unsplashAccessKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
            buildConfigField 'String', 'CURRENTS_API_KEY', '"' + currentsApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
        }
        release {
            // Public release APKs never contain private credentials, even when local.properties has them.
            buildConfigField 'String', 'UNSPLASH_ACCESS_KEY', '""'
            buildConfigField 'String', 'CURRENTS_API_KEY', '""'
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
